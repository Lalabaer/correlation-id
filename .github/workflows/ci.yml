name: CI

on:
    pull_request:
    push:
        branches:
            - main
        tags:
            - 'v*'

concurrency:
    group: correlation-id-ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Enable Corepack
              run: corepack enable

            - name: Install dependencies
              run: yarn install --immutable

            - name: Lint
              run: yarn lint

            - name: Format check
              run: yarn format:check

            - name: Typecheck
              run: yarn typecheck

            - name: Test
              run: yarn test

            - name: Check dist is up to date
              run: yarn check:dist
